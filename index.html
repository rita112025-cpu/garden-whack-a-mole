<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>菜園打地鼠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen game — scoreboard plank on top, 3x3 field of soil holes, status line below. Single deliberate daylight look. */
:root {
  --grass: #4f8a3c;
  --grass-dark: #3c6d2d;
  --soil: #5a3a22;
  --soil-deep: #2e1d10;
  --plank: #c98a4b;
  --plank-edge: #8a5a2b;
  --ink: #2a1a0d;
  --paper: #fff6e3;
  --gold: #f2c230;
  --danger: #d9483b;
  --display: "Lilita One", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.08) 0 2px, transparent 3px) 0 0/38px 38px,
    radial-gradient(circle at 70% 60%, rgba(0,0,0,.08) 0 2px, transparent 3px) 0 0/46px 46px,
    linear-gradient(var(--grass), var(--grass-dark));
  color: var(--paper);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.wrap {
  min-height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(28px, 7vw, 44px); letter-spacing: .04em;
  color: var(--paper); text-shadow: 0 3px 0 var(--soil-deep);
  text-wrap: balance; text-align: center;
}
.board {
  width: min(520px, 100%);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  background: linear-gradient(var(--plank), #b87a3f);
  border: 3px solid var(--plank-edge); border-radius: 10px;
  padding: 10px 12px; box-sizing: border-box; color: var(--ink);
  box-shadow: 0 4px 0 var(--soil-deep);
}
.stat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.stat span { font-size: 12px; font-weight: 700; letter-spacing: .12em; opacity: .75; }
.stat b {
  font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6vw, 32px);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.stat b.low { color: var(--danger); }
.field {
  width: min(520px, 100%);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 3vw, 20px);
  touch-action: manipulation;
}
.hole {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%;
  border: 0; padding: 0; background: none; cursor: pointer;
  overflow: hidden; border-radius: 0 0 50% 50% / 0 0 30% 30%;
}
.hole:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.hole::before { /* the dark opening */
  content: ""; position: absolute; left: 6%; right: 6%; bottom: 8%; height: 30%;
  background: radial-gradient(ellipse at 50% 40%, var(--soil-deep) 55%, var(--soil) 72%);
  border-radius: 50%; z-index: 1;
}
.hole::after { /* front lip of dirt, covers the mole's lower body */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
  background: linear-gradient(#6d4729, var(--soil));
  border-radius: 50% 50% 46% 46% / 70% 70% 30% 30%; z-index: 3;
  box-shadow: inset 0 4px 0 rgba(255,255,255,.12);
}
.critter {
  position: absolute; left: 18%; width: 64%; bottom: 10%; z-index: 2;
  transform: translateY(105%); transition: transform .14s ease-out;
  pointer-events: none;
}
.critter svg { display: block; width: 100%; height: auto; }
.hole.up .critter { transform: translateY(0); }
.hole.hit .critter { transform: translateY(18%) scale(.92, .8); transition-duration: .06s; }
.critter .gold-only, .critter .bomb-only, .critter .helmet-only, .critter .ninja-only,
.critter .clock-only, .critter .crack { display: none; }
.hole.gold .gold-only, .hole.bomb .bomb-only, .hole.helmet .helmet-only,
.hole.ninja .ninja-only, .hole.clock .clock-only, .hole.cracked .crack { display: inline; }
.hole.gold .fur { fill: var(--gold); }
.hole.ninja .fur { fill: #4a4f5c; }
.hole.cracked .helmet-shell { fill: #9aa3ad; }
.hole.bomb .mole-only, .hole.clock .mole-only { display: none; }
.pop {
  position: absolute; left: 50%; top: 18%; z-index: 4; pointer-events: none;
  font-family: var(--display); font-size: clamp(20px, 6vw, 30px);
  color: var(--paper); text-shadow: 0 2px 0 var(--soil-deep);
  animation: pop .6s ease-out forwards;
}
.pop.neg { color: #ffd2cc; }
@keyframes pop { from { transform: translate(-50%, 0); opacity: 1 } to { transform: translate(-50%, -60%); opacity: 0 } }

.legend {
  width: min(520px, 100%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px;
  font-size: 14px; font-weight: 500;
}
.legend i { font-style: normal; font-family: var(--display); color: var(--gold); }
.legend i.neg { color: #ffd2cc; }

.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgba(30, 20, 10, .55);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: min(360px, 100%); box-sizing: border-box;
  background: var(--paper); color: var(--ink); border-radius: 14px;
  border: 3px solid var(--plank-edge); box-shadow: 0 6px 0 var(--soil-deep);
  padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; }
.card p { margin: 0; line-height: 1.6; font-size: 15px; }
.card .big { font-family: var(--display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.btn {
  font: 700 18px var(--body); letter-spacing: .08em;
  background: var(--danger); color: #fff; border: 0; border-radius: 999px;
  padding: 12px 32px; cursor: pointer; box-shadow: 0 4px 0 #8f2a21;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f2a21; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.mute {
  font: 500 14px var(--body); background: none; border: 2px solid var(--plank-edge);
  color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
@media (prefers-reduced-motion: reduce) {
  .critter { transition-duration: .01s; }
  .pop { animation-duration: .01s; }
}
</style>
</head>
<body>

<div class="wrap">
  <h1>菜園打地鼠</h1>

  <div class="board" aria-live="polite">
    <div class="stat"><span>分數</span><b id="score">0</b></div>
    <div class="stat"><span>時間</span><b id="time">30</b></div>
    <div class="stat"><span>最高分</span><b id="best">0</b></div>
  </div>

  <div class="field" id="field"></div>

  <div class="legend">
    <span>地鼠 <i>+10</i></span>
    <span>金地鼠 <i>+30</i></span>
    <span>頭盔地鼠 打 2 下 <i>+25</i></span>
    <span>忍者地鼠 <i>+50</i></span>
    <span>鬧鐘 <i>+3 秒</i></span>
    <span>炸彈 <i class="neg">−20</i></span>
    <span>連擊 3 次以上分數加倍</span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="ovTitle">準備好了嗎？</h2>
    <div class="big" id="ovScore" hidden>0</div>
    <p id="ovText">30 秒內點擊冒出來的地鼠。<br>越到後面，地鼠出現得越快。<br>別打到炸彈！</p>
    <div class="row">
      <button class="btn" id="startBtn" type="button">開始</button>
      <button class="mute" id="muteBtn" type="button">音效：開</button>
    </div>
  </div>
</div>

<template id="critterTpl">
  <div class="critter">
    <svg viewBox="0 0 100 110" aria-hidden="true">
      <g class="mole-only">
        <ellipse class="fur" cx="50" cy="66" rx="40" ry="44" fill="#8b5e3c"/>
        <ellipse cx="50" cy="80" rx="24" ry="24" fill="#d9b08c"/>
        <g class="ninja-only">
          <rect x="12" y="41" width="76" height="17" rx="4" fill="#1b1b22"/>
          <path d="M86 44 L99 37 L97 51 Z M86 50 L98 56 L92 60 Z" fill="#1b1b22"/>
          <circle cx="35" cy="50" r="8" fill="#ffffff"/>
          <circle cx="65" cy="50" r="8" fill="#ffffff"/>
        </g>
        <circle cx="35" cy="50" r="6" fill="#1b120a"/>
        <circle cx="65" cy="50" r="6" fill="#1b120a"/>
        <circle cx="37" cy="48" r="2" fill="#ffffff"/>
        <circle cx="67" cy="48" r="2" fill="#ffffff"/>
        <ellipse cx="50" cy="64" rx="10" ry="7" fill="#e86f86"/>
        <rect x="45" y="70" width="10" height="8" rx="1" fill="#ffffff"/>
        <ellipse cx="22" cy="68" rx="7" ry="3" fill="#f4a3b4"/>
        <ellipse cx="78" cy="68" rx="7" ry="3" fill="#f4a3b4"/>
        <g class="gold-only">
          <path d="M30 22 L38 34 L50 18 L62 34 L70 22 L68 40 L32 40 Z" fill="#f2c230" stroke="#8a5a2b" stroke-width="2"/>
        </g>
        <g class="helmet-only">
          <path class="helmet-shell" d="M12 42 C14 6 86 6 88 42 Z" fill="#c9d1d9" stroke="#5b6670" stroke-width="3"/>
          <rect x="8" y="38" width="84" height="7" rx="3" fill="#5b6670"/>
          <path class="crack" d="M52 12 L44 22 L54 28 L45 38" stroke="#2a1a0d" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
        </g>
      </g>
      <g class="clock-only">
        <circle cx="28" cy="32" r="11" fill="#d9483b"/>
        <circle cx="72" cy="32" r="11" fill="#d9483b"/>
        <circle cx="50" cy="68" r="37" fill="#d9483b"/>
        <circle cx="50" cy="68" r="29" fill="#fff6e3"/>
        <path d="M50 68 L50 48 M50 68 L64 75" stroke="#2a1a0d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="68" r="3.5" fill="#2a1a0d"/>
      </g>
      <g class="bomb-only">
        <circle cx="50" cy="68" r="36" fill="#26262b"/>
        <circle cx="38" cy="56" r="8" fill="#55555e"/>
        <rect x="42" y="24" width="16" height="12" rx="2" fill="#55555e"/>
        <path d="M50 24 C52 14 60 10 66 12" stroke="#8a5a2b" stroke-width="3" fill="none"/>
        <circle cx="67" cy="11" r="5" fill="#f2c230"/>
        <circle cx="67" cy="11" r="2.5" fill="#d9483b"/>
      </g>
    </svg>
  </div>
</template>

<script>
(() => {
  const GAME_SECONDS = 30;
  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovScore = document.getElementById('ovScore');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');
  const tpl = document.getElementById('critterTpl');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  let best = parseInt(store.get('wam-best') || '0', 10) || 0;
  let muted = store.get('wam-muted') === '1';
  bestEl.textContent = best;
  muteBtn.textContent = muted ? '音效：關' : '音效：開';

  // Build 9 holes
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hole';
    b.id = 'hole-' + i;
    b.setAttribute('aria-label', '洞 ' + (i + 1));
    b.appendChild(tpl.content.cloneNode(true));
    field.appendChild(b);
    holes.push({ el: b, kind: null, timer: null });
  }

  // Audio (created on first click)
  let ctx = null;
  function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (muted || !ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur);
  }

  let score = 0, timeLeft = GAME_SECONDS, running = false, combo = 0;
  let tickTimer = null, spawnTimer = null, startedAt = 0;

  function setScore(v) { score = Math.max(0, v); scoreEl.textContent = score; }

  function popText(hole, text, neg) {
    const s = document.createElement('span');
    s.className = 'pop' + (neg ? ' neg' : '');
    s.textContent = text;
    hole.el.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }

  const KIND_CLASSES = ['up', 'hit', 'gold', 'bomb', 'helmet', 'ninja', 'clock', 'cracked'];
  const POINTS = { mole: 10, gold: 30, helmet: 25, ninja: 50 };

  function hide(h) {
    clearTimeout(h.timer);
    h.el.classList.remove(...KIND_CLASSES);
    // a mole that escapes breaks the combo (bombs and clocks don't count)
    if (h.kind && POINTS[h.kind] && !h.whacked) combo = 0;
    h.kind = null; h.whacked = false;
  }

  function progress() { // 0 → 1 over the round
    return Math.min(1, (performance.now() - startedAt) / (GAME_SECONDS * 1000));
  }

  // p = round progress 0→1; bombs and ninjas get more common later on
  function pickKind(p) {
    const table = [
      ['gold', 0.10],
      ['helmet', 0.12],
      ['ninja', p > 0.2 ? 0.06 : 0],
      ['clock', 0.05],
      ['bomb', 0.08 + p * 0.10],
    ];
    let r = Math.random();
    for (const [kind, w] of table) { if (r < w) return kind; r -= w; }
    return 'mole';
  }

  function spawn() {
    if (!running) return;
    const p = progress();
    const free = holes.filter(h => !h.kind);
    if (free.length) {
      const h = free[Math.floor(Math.random() * free.length)];
      h.kind = pickKind(p);
      h.hp = h.kind === 'helmet' ? 2 : 1;
      h.whacked = false;
      h.el.classList.remove(...KIND_CLASSES);
      if (h.kind !== 'mole') h.el.classList.add(h.kind);
      // force reflow so the rise animates even right after a hide
      void h.el.offsetWidth;
      h.el.classList.add('up');
      const baseStay = { gold: 650, ninja: 480, helmet: 1400, clock: 900 }[h.kind] || 1100;
      const stay = Math.max(320, baseStay - p * 450);
      h.timer = setTimeout(() => hide(h), stay);
    }
    const gap = 820 - p * 480 + Math.random() * 200;
    spawnTimer = setTimeout(spawn, gap);
  }

  function whack(h) {
    if (!running || !h.kind || h.whacked) return;
    if (h.kind === 'helmet' && h.hp > 1) {
      h.hp--;
      h.el.classList.add('cracked');
      popText(h, '叮！', false);
      tone(1600, 0.07, 'square', 0.06);
      return;
    }
    h.whacked = true;
    clearTimeout(h.timer);
    h.el.classList.add('hit');
    if (h.kind === 'clock') {
      timeLeft += 3;
      timeEl.textContent = timeLeft;
      if (timeLeft > 5) timeEl.classList.remove('low');
      popText(h, '+3 秒', false);
      tone(660, 0.08, 'triangle', 0.1); setTimeout(() => tone(990, 0.12, 'triangle', 0.1), 80);
    } else if (h.kind === 'bomb') {
      combo = 0;
      setScore(score - 20);
      popText(h, '−20', true);
      tone(120, 0.35, 'sawtooth', 0.12, -80);
      if (navigator.vibrate) { try { navigator.vibrate(80); } catch {} }
    } else {
      combo++;
      const base = POINTS[h.kind];
      const gain = combo >= 3 ? base * 2 : base;
      setScore(score + gain);
      popText(h, '+' + gain + (combo >= 3 ? ' ×' + combo : ''), false);
      if (h.kind === 'gold' || h.kind === 'ninja') { tone(880, 0.08, 'square'); setTimeout(() => tone(1320, 0.12, 'square'), 70); }
      else tone(520 + Math.min(combo, 8) * 40, 0.09, 'square', 0.08, -200);
    }
    setTimeout(() => { h.kind = null; h.el.classList.remove(...KIND_CLASSES); }, 180);
  }

  holes.forEach(h => {
    h.el.addEventListener('pointerdown', e => { e.preventDefault(); whack(h); });
    // keyboard support (Enter/Space); pointer clicks are already handled above
    h.el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); whack(h); }
    });
  });
  // number keys 1-9 map to the grid like a phone keypad
  document.addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) whack(holes[n - 1]);
  });

  function start() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    holes.forEach(hide);
    setScore(0); combo = 0;
    timeLeft = GAME_SECONDS; timeEl.textContent = timeLeft; timeEl.classList.remove('low');
    overlay.hidden = true;
    running = true; startedAt = performance.now();
    tone(660, 0.1, 'triangle', 0.1);
    spawnTimer = setTimeout(spawn, 400);
    tickTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 5) { timeEl.classList.add('low'); tone(990, 0.05, 'triangle', 0.05); }
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    running = false;
    clearInterval(tickTimer); clearTimeout(spawnTimer);
    holes.forEach(h => { h.whacked = true; hide(h); });
    const isBest = score > best;
    if (isBest) { best = score; bestEl.textContent = best; store.set('wam-best', String(best)); }
    ovTitle.textContent = isBest && score > 0 ? '新紀錄！' : '時間到';
    ovScore.hidden = false; ovScore.textContent = score;
    ovText.textContent = isBest && score > 0 ? '這是你目前的最高分。' : '最高分：' + best;
    startBtn.textContent = '再玩一次';
    overlay.hidden = false;
    startBtn.focus();
    tone(440, 0.15, 'triangle', 0.1); setTimeout(() => tone(330, 0.25, 'triangle', 0.1), 150);
  }

  startBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    store.set('wam-muted', muted ? '1' : '0');
    muteBtn.textContent = muted ? '音效：關' : '音效：開';
  });

  // end the round if the tab is hidden, so timers don't run in the background
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) end();
  });

  // Resting frame: show a few critters peeking so the field isn't empty
  [[1,'mole'],[3,'gold'],[8,'bomb'],[5,'helmet'],[6,'ninja'],[2,'clock']].forEach(([i,k]) => {
    if (k !== 'mole') holes[i].el.classList.add(k);
    holes[i].el.classList.add('up');
  });
})();
</script>
</body>
</html>
